name: Deploy API

on:
  push:
    branches: [main]
    paths: ["app/**"]
  workflow_dispatch:
  
permissions:
  contents: read
  id-token: write

env:
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/api-dev-repository/sales-api:${{ github.sha }}   

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Docker login no Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build e push da imagem
        run: |
          docker build -t $IMAGE app/
          docker push $IMAGE

      - name: Migrations
        run: |
          gcloud run jobs update migrate-database \
            --project ${{ vars.GCP_PROJECT_ID }} --region ${{ vars.GCP_REGION }} \
            --image $IMAGE
          gcloud run jobs execute migrate-database \
            --project ${{ vars.GCP_PROJECT_ID }} --region ${{ vars.GCP_REGION }} \
            --wait

      - name: Deploy
        run: |
          gcloud run deploy cloudrun-api \
            --project ${{ vars.GCP_PROJECT_ID }} --region ${{ vars.GCP_REGION }} \
            --image $IMAGE

